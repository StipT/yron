  #     - name: Check formatting
  #       run: dart format --set-exit-if-changed .

  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dart-version: ${{ env.DART_VERSION }}
          channel: 'stable'
      - name: Create .env file
        run: |
          touch .env
          echo "API_URL=https://api.example.com" >> .env
      - name: Install dependencies
        run: flutter pub get
      - name: Run unit tests with coverage
        run: flutter test --coverage test/unit/
      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info | grep "lines" | cut -d ' ' -f 4 | cut -d '%' -f 1)
          if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "Coverage is $COVERAGE%, which is below the minimum required ${{ env.MIN_COVERAGE }}%"
            exit 1
          fi
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  widget_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dart-version: ${{ env.DART_VERSION }}
          channel: 'stable'
      - name: Create .env file
        run: |
          touch .env
          echo "API_URL=https://api.example.com" >> .env
      - name: Install dependencies
        run: flutter pub get
      - name: Run widget tests
        run: flutter test test/widget/
        timeout-minutes: 10

  # golden_tests:
