name: Flutter Test Pipeline
on:
  push:
    branches:
      - 'feature/515-testing-strategy'
  pull_request:
    branches:
      - 'feature/515-testing-strategy'

env:
  MIN_COVERAGE: 80
  FLUTTER_VERSION: '3.27.1'
  DART_VERSION: '3.4.3'

jobs:
