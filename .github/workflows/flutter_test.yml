  #       with:
  #         name: golden-test-failures
  #         path: test/golden/failures/
  #         retention-days: 5

  performance_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          dart-version: ${{ env.DART_VERSION }}
          channel: 'stable'
      - name: Create .env file
        run: |
          touch .env
          echo "API_URL=${{ secrets.API_URL }}" >> .env
          echo "AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}" >> .env
          echo "AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}" >> .env
          echo "THRYVE_APP_ID=${{ secrets.THRYVE_APP_ID }}" >> .env
          echo "THRYVE_APP_SECRET=${{ secrets.THRYVE_APP_SECRET }}" >> .env
      - name: Install dependencies
        run: flutter pub get
      - name: Run performance tests
        run: flutter test --tags="performance"
        timeout-minutes: 10
      - name: Check performance thresholds
        run: |
          if grep -q "FAILED" test-results.json; then
            echo "Performance tests failed to meet thresholds"
            exit 1
          fi

