name: yron_ui
description: Shared UI components and theme for Yron.
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 700
